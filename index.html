<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/css/styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Watchlist</title>
</head>
<body class="index-body">
        <video autoplay muted loop playsinline      class="body-video">
            <source src="images\3d-visual.mp4" type="video/mp4">
        </video>
    <div class="father">
        <header>
            <h1>Find your film</h1>
            <p id="watchlistEl" role="button"><a href="watchlist.html">My Watchlist</a></p>
        </header>
        <div class="search-div">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"     xmlns="http://www.w3.org/2000/svg">
                <circle cx="10.5" cy="10.5" r="6.5" stroke="#9CA3AF" stroke-width="2.5"/>
                <path d="M15.5 15.5L20.5 20.5" stroke="#9CA3AF" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
            <form id="form">
                <input id="inputEl" type="text" placeholder="Search for a movie">
                <button type="submit" id="submitEl">Search</button>
            </form>
        </div>

        <main>

           <div class="empty-search"></div>

        </main>
        
    </div>
    <script type="module" src="js/script.js"></script>
</body>
</html>
