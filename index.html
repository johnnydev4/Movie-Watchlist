<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/css/styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Watchlist</title>
</head>
<body>
    <div class="father">
        <header>
            <h1>Find your film</h1>
            <p>My Watchlist</p>
        </header>
        <div class="search-div">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"     xmlns="http://www.w3.org/2000/svg">
                <circle cx="10.5" cy="10.5" r="6.5" stroke="#9CA3AF" stroke-width="2.5"/>
                <path d="M15.5 15.5L20.5 20.5" stroke="#9CA3AF" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
            <form>
                <input type="text" placeholder="Search for a movie">
                <button type="submit">Search</button>
            </form>
        </div>
        <main>
            <div class="movie-card">
                <div class="movie-title">
                    <img height="147.41px" width="99px">
                    <h2>Blade Runner</h2>
                    <img height="15px" width="15px">
                    <p>8.1</p>
                </div>

                <div class="movie-info">
                    <p>117 min</p>
                    <p>Action, Drama, Sci-fi</p>
                    <img height="16px" width="16px">
                    <p>Watchlist</p>
                </div> 

                <div class="movie-description">
                    <p>A blade runner must pursue and terminate four replicants who stole a ship in space, and have returned to Earth to find their creator.</p>
                </div>

            </div>

        </main>
    </div>
    <script type="module" src="/js/script.js"></script>
</body>
</html>
